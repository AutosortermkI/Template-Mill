[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "templatemill"
version = "0.1.0"
description = "Automated demand intelligence, product scaffolding, multi-platform distribution, and performance analytics pipeline for digital template products."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.12.0",
    "flask>=3.1.0",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "pillow>=11.0.0",
    "playwright>=1.49.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pytrends>=4.9.0",
    "redis>=5.2.0",
    "scikit-learn>=1.6.0",
    "sqlalchemy>=2.0.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-recording>=0.13.0",
    "ruff>=0.8.0",
    "vcrpy>=7.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (deselect with '-m \"not integration\"')",
]
